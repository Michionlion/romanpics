[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "romanpics-worker"
version = "0.2.0"
description = "Offline-first ingestion, preview, similarity, and lifecycle workers for RomanPics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "RomanPics contributors"}]
dependencies = [
  "asdf>=4.0,<6",
  "astropy>=6.1,<9",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<13",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pip-audit>=2.9,<3", "pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
openclip = ["open-clip-torch>=2.26,<4", "torch>=2.3,<3"]
siglip = ["transformers>=4.44,<6", "torch>=2.3,<3"]

[project.scripts]
romanpics-worker = "romanpics_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/romanpics_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["postgres: opt-in tests requiring ROMANPICS_TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
